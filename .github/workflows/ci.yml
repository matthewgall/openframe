name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match the `toolchain` directive in go.mod: CI runs with
  # GOTOOLCHAIN=local, so the exact patch release is installed here.
  # (A floating "1.26" resolves to whatever the runner image caches,
  # which can drift from go.mod and change vuln-scan results.)
  GO_VERSION: "1.26.11"

jobs:
  # --- Pipeline shape ------------------------------------------------------
  #   test ──┬──> web (admin SPA) ──> build (binaries)
  #   vuln ──┘
  # test and vuln run in parallel; the SPA build waits for BOTH, and
  # the binary cross-compile waits for the SPA build. So binaries are
  # only produced (and only embed the committed dist/) after the full
  # suite AND the dependency audit passed. (The Go build embeds the
  # committed web/admin/dist bytes — the web job is what proves those
  # bytes match the SPA sources before they get embedded.)

  # --- Tests (gate 1 of 2) -------------------------------------------------
  # One runner: fmt/vet/test share the same module cache.
  test:
    name: tests (gofmt + vet + race)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "unformatted files:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: Test
        run: go test ./... -race -count=1

  # --- Cross-builds --------------------------------------------------------
  # Depends on web, which itself requires test + vuln: binaries are
  # only built (and uploaded) once everything upstream is green.
  #
  # Every supported target in ONE job: the codebase is pure Go
  # (CGO_ENABLED=0, no cgo), so all of these are plain cross-compiles.
  # A single warm-cache runner building 20 small binaries beats 10
  # matrix runners each paying checkout + toolchain setup overhead.
  # ARM is offered as v6 (32-bit Pi Zero/1) and v7 (32-bit Pi 3/4).
  build:
    name: cross-compile (all targets)
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          LDFLAGS="-X github.com/matthewgall/openframe/internal/version.Commit=${GITHUB_SHA::12}"
          build() { # os arch name [goarm]
            os=$1; arch=$2; name=$3; goarm=$4
            for c in openframe openframe-updater; do
              out="dist/openframe-${os}-${name}/${c}"
              [ "$os" = "windows" ] && out="${out}.exe"
              GOOS="$os" GOARCH="$arch" GOARM="$goarm" go build -ldflags "$LDFLAGS" -o "$out" "./cmd/$c"
              echo "built ${out}"
            done
          }
          build linux   amd64   amd64
          build linux   arm64   arm64
          build linux   386     386
          build linux   riscv64 riscv64
          build linux   arm     armv6 6
          build linux   arm     armv7 7
          build darwin  amd64   amd64
          build darwin  arm64   arm64
          build windows amd64   amd64
          build windows arm64   arm64
          (cd dist && find . -type f ! -name SHA256SUMS.txt -exec sha256sum {} \; | sort -k2 > SHA256SUMS.txt)
      # Only the host-arch binaries can execute on the runner; the
      # others are verified by the build itself.
      - name: "Smoke: frame version + doctor"
        run: |
          ./dist/openframe-linux-amd64/openframe version
          ./dist/openframe-linux-amd64/openframe doctor --json | grep -q '"checks"'
      - name: "Smoke: updater version"
        run: ./dist/openframe-linux-amd64/openframe-updater --version
      - uses: actions/upload-artifact@v7
        with:
          name: openframe-binaries
          path: dist

  # --- Web UI build (gate 2: runs after test AND vuln, before build) ---
  web:
    name: admin SPA build
    needs: [test, vuln]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Cache node modules
        uses: actions/cache@v5
        with:
          path: web/admin/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('web/admin/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit check
        # Run from the repo root: job-level working-directory is
        # web/admin, and git pathspecs are relative to the step CWD
        # (from web/admin the old "web/admin/dist" did not exist, so
        # git errored and the check warned on EVERY run).
        working-directory: .
        run: |
          # The embedded dist/ is committed; CI verifies the build is
          # reproducible from the checked-in sources.
          if ! git diff --exit-code --quiet -- web/admin/dist; then
            echo "::warning::web/admin/dist is out of date; run 'make web' and commit"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: openframe-admin-dist
          path: web/admin/dist

  # --- Dependency audit (gate 2 of 2, parallel with test) -----------------
  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
