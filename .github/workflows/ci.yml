name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match the `toolchain` directive in go.mod: CI runs with
  # GOTOOLCHAIN=local, so the exact patch release is installed here.
  # (A floating "1.26" resolves to whatever the runner image caches,
  # which can drift from go.mod and change vuln-scan results.)
  GO_VERSION: "1.26.11"

jobs:
  # --- Format & static analysis -----------------------------------------
  fmt-vet:
    name: gofmt + go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "unformatted files:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...

  # --- Tests -------------------------------------------------------------
  test:
    name: tests (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Test
        run: go test ./... -race -count=1

  # --- Cross-builds ------------------------------------------------------
  build:
    name: build linux/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          LDFLAGS="-X github.com/matthewgall/openframe/internal/version.Commit=${GITHUB_SHA::12}"
          go build -ldflags "$LDFLAGS" -o /tmp/openframe ./cmd/openframe
          go build -ldflags "$LDFLAGS" -o /tmp/openframe-updater ./cmd/openframe-updater
      # Only the host-arch binaries can execute on the runner; the other
      # matrix entry is cross-compiled and verified by the build itself.
      - name: "Smoke: frame version + doctor"
        if: matrix.arch == 'amd64'
        run: |
          /tmp/openframe version
          /tmp/openframe doctor --json | grep -q '"checks"'
      - name: "Smoke: updater version"
        if: matrix.arch == 'amd64'
        run: /tmp/openframe-updater --version
      - uses: actions/upload-artifact@v4
        with:
          name: openframe-linux-${{ matrix.arch }}
          path: |
            /tmp/openframe
            /tmp/openframe-updater

  # --- Web UI build -------------------------------------------------------
  web:
    name: admin SPA build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit check
        run: |
          # The embedded dist/ is committed; CI verifies the build is
          # reproducible from the checked-in sources.
          if ! git diff --exit-code --quiet web/admin/dist; then
            echo "::warning::web/admin/dist is out of date; run 'make web' and commit"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: openframe-admin-dist
          path: web/admin/dist

  # --- Dependency audit ----------------------------------------------------
  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
